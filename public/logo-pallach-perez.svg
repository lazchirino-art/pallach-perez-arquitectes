<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#E0DDD7" stroke-width="0.4"/>
    </pattern>
  </defs>

  <!-- === BUILDING ILLUSTRATION === -->
  <!-- Base ground line -->
  <line x1="100" y1="210" x2="400" y2="210" stroke="#2D4A5E" stroke-width="1.5"/>

  <!-- Main building body left -->
  <rect x="140" y="155" width="70" height="55" fill="none" stroke="#2D4A5E" stroke-width="1.5"/>
  <!-- Teal accent windows left building -->
  <rect x="148" y="163" width="18" height="22" fill="#8BB8C0" opacity="0.7"/>
  <rect x="172" y="163" width="18" height="22" fill="#8BB8C0" opacity="0.7"/>
  <!-- Hatch left building bottom -->
  <rect x="148" y="190" width="54" height="16" fill="none" stroke="#2D4A5E" stroke-width="1"/>
  <line x1="148" y1="194" x2="202" y2="194" stroke="#2D4A5E" stroke-width="0.6"/>
  <line x1="148" y1="198" x2="202" y2="198" stroke="#2D4A5E" stroke-width="0.6"/>
  <line x1="148" y1="202" x2="202" y2="202" stroke="#2D4A5E" stroke-width="0.6"/>

  <!-- Central tower tall -->
  <rect x="210" y="115" width="80" height="95" fill="none" stroke="#2D4A5E" stroke-width="1.5"/>
  <!-- Central teal vertical panels -->
  <rect x="218" y="123" width="16" height="50" fill="#8BB8C0" opacity="0.8"/>
  <rect x="238" y="123" width="16" height="50" fill="#8BB8C0" opacity="0.8"/>
  <rect x="258" y="123" width="16" height="50" fill="#8BB8C0" opacity="0.8"/>
  <!-- Central building bottom section hatch -->
  <rect x="218" y="178" width="54" height="28" fill="none" stroke="#2D4A5E" stroke-width="0.8"/>
  <line x1="218" y1="183" x2="272" y2="183" stroke="#2D4A5E" stroke-width="0.5"/>
  <line x1="218" y1="188" x2="272" y2="188" stroke="#2D4A5E" stroke-width="0.5"/>
  <line x1="218" y1="193" x2="272" y2="193" stroke="#2D4A5E" stroke-width="0.5"/>
  <line x1="218" y1="198" x2="272" y2="198" stroke="#2D4A5E" stroke-width="0.5"/>
  <line x1="218" y1="203" x2="272" y2="203" stroke="#2D4A5E" stroke-width="0.5"/>

  <!-- Horizontal beam over central -->
  <rect x="200" y="108" width="100" height="10" fill="#2D4A5E" opacity="0.15" stroke="#2D4A5E" stroke-width="1.5"/>

  <!-- Right building -->
  <rect x="290" y="145" width="75" height="65" fill="none" stroke="#2D4A5E" stroke-width="1.5"/>
  <!-- Right teal window -->
  <rect x="300" y="153" width="25" height="28" fill="#8BB8C0" opacity="0.7"/>
  <!-- Right hatch diagonal section -->
  <rect x="330" y="153" width="25" height="28" fill="none" stroke="#2D4A5E" stroke-width="0.8"/>
  <line x1="330" y1="153" x2="355" y2="181" stroke="#2D4A5E" stroke-width="0.6"/>
  <line x1="335" y1="153" x2="355" y2="173" stroke="#2D4A5E" stroke-width="0.6"/>
  <line x1="330" y1="158" x2="350" y2="181" stroke="#2D4A5E" stroke-width="0.6"/>
  <line x1="330" y1="164" x2="345" y2="181" stroke="#2D4A5E" stroke-width="0.6"/>
  <!-- Right building base -->
  <rect x="298" y="185" width="59" height="22" fill="none" stroke="#2D4A5E" stroke-width="0.8"/>

  <!-- Staircase left -->
  <line x1="120" y1="210" x2="140" y2="210" stroke="#2D4A5E" stroke-width="1.5"/>
  <line x1="125" y1="205" x2="140" y2="205" stroke="#2D4A5E" stroke-width="1.2"/>
  <line x1="130" y1="200" x2="140" y2="200" stroke="#2D4A5E" stroke-width="1.2"/>
  <line x1="135" y1="195" x2="140" y2="195" stroke="#2D4A5E" stroke-width="1.2"/>
  <line x1="125" y1="205" x2="125" y2="210" stroke="#2D4A5E" stroke-width="1.2"/>
  <line x1="130" y1="200" x2="130" y2="210" stroke="#2D4A5E" stroke-width="1.2"/>
  <line x1="135" y1="195" x2="135" y2="210" stroke="#2D4A5E" stroke-width="1.2"/>

  <!-- Staircase right -->
  <line x1="365" y1="210" x2="380" y2="210" stroke="#2D4A5E" stroke-width="1.5"/>
  <line x1="365" y1="205" x2="375" y2="205" stroke="#2D4A5E" stroke-width="1.2"/>
  <line x1="365" y1="200" x2="370" y2="200" stroke="#2D4A5E" stroke-width="1.2"/>
  <line x1="365" y1="205" x2="365" y2="210" stroke="#2D4A5E" stroke-width="1.2"/>
  <line x1="370" y1="200" x2="370" y2="210" stroke="#2D4A5E" stroke-width="1.2"/>
  <line x1="375" y1="205" x2="375" y2="210" stroke="#2D4A5E" stroke-width="1.2"/>

  <!-- Technical lines / measurement marks -->
  <line x1="250" y1="90" x2="250" y2="108" stroke="#2D4A5E" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="250" y1="82" x2="250" y2="88" stroke="#2D4A5E" stroke-width="1"/>
  <line x1="246" y1="82" x2="254" y2="82" stroke="#2D4A5E" stroke-width="1"/>

  <line x1="108" y1="155" x2="139" y2="155" stroke="#2D4A5E" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="100" y1="155" x2="106" y2="155" stroke="#2D4A5E" stroke-width="1"/>
  <line x1="100" y1="151" x2="100" y2="159" stroke="#2D4A5E" stroke-width="1"/>

  <line x1="362" y1="115" x2="390" y2="115" stroke="#2D4A5E" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="392" y1="115" x2="398" y2="115" stroke="#2D4A5E" stroke-width="1"/>
  <line x1="398" y1="111" x2="398" y2="119" stroke="#2D4A5E" stroke-width="1"/>

  <!-- === TEXT === -->
  <text
    x="250"
    y="252"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    font-weight="400"
    letter-spacing="10"
    fill="#2D4A5E"
    text-anchor="middle"
  >PALLACH PEREZ</text>

  <text
    x="250"
    y="270"
    font-family="Georgia, serif"
    font-size="9"
    font-weight="400"
    letter-spacing="5"
    fill="#8BB8C0"
    text-anchor="middle"
  >ARQUITECTES</text>
</svg>
